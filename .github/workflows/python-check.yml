name: Python CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  cek-kode-python:
    runs-on: ubuntu-latest 

    steps:
    - name: Mengambil kode dari repository
      uses: actions/checkout@v3

    - name: Menyiapkan Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install alat pengecek kode (Flake8)
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Eksekusi Pengecekan Kode
      run: |
        # Perintah ini mengecek seluruh file .py di foldermu.
        # Kalau ada sintaks yang salah fatal, proses push akan digagalkan (tanda silang merah).
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics